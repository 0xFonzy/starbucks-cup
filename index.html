<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Holiday Cup Puzzle</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;600;700&display=swap">
<style>
  /* Layout: one narrow column; the evergreen tray holding the board is the only framed object. */
  :root {
    --page: #edf2ee;
    --ink: #12332a;
    --ink-soft: #4a655c;
    --line: #cbd8d1;
    --tray: #174c3d;
    --tray-ink: #f6f1e4;
    --berry: #c2233b;
    --berry-ink: #ffffff;
    --gold: #f2b233;
    --blank: #ffffff;
    --blank-edge: #b9c7c0;
    --shadow: rgba(4, 22, 17, .4);
    --display: "Caprasimo", "Cooper Black", Georgia, serif;
    --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page: #0c1f1a;
      --ink: #eef3ec;
      --ink-soft: #a4b8ae;
      --line: #2a4239;
      --tray: #185040;
      --tray-ink: #f6f1e4;
      --berry: #ee6074;
      --berry-ink: #2a0409;
      --gold: #f6c453;
      --blank: #f6f1e4;
      --blank-edge: #b3bfb6;
      --shadow: rgba(0, 0, 0, .55);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --page: #0c1f1a;
    --ink: #eef3ec;
    --ink-soft: #a4b8ae;
    --line: #2a4239;
    --tray: #185040;
    --tray-ink: #f6f1e4;
    --berry: #ee6074;
    --berry-ink: #2a0409;
    --gold: #f6c453;
    --blank: #f6f1e4;
    --blank-edge: #b3bfb6;
    --shadow: rgba(0, 0, 0, .55);
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font: 400 16px/1.5 var(--body);
  }
  .wrap {
    max-width: 460px;
    margin: 0 auto;
    padding-block: 28px 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .head { display: flex; flex-direction: column; gap: 6px; }
  h1 {
    margin: 0;
    font: 400 clamp(30px, 9vw, 40px)/1.05 var(--display);
    letter-spacing: -.01em;
    text-wrap: balance;
  }
  .how { margin: 0; color: var(--ink-soft); max-width: 40ch; }

  .tray {
    background: var(--tray);
    border-radius: 22px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    box-shadow: 0 14px 30px -18px var(--shadow);
  }
  .board {
    --gap: 6px;
    position: relative;
    width: 100%;
    max-width: 100%;
    aspect-ratio: 1;
    border-radius: 12px;
  }
  .tile {
    position: absolute;
    left: calc(var(--c) * (100% + var(--gap)) / 3);
    top: calc(var(--r) * (100% + var(--gap)) / 3);
    width: calc((100% - 2 * var(--gap)) / 3);
    height: calc((100% - 2 * var(--gap)) / 3);
    padding: 0;
    border: 0;
    border-radius: 10px;
    overflow: hidden;
    background: var(--blank);
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    transition:
      left .24s cubic-bezier(.2, .8, .2, 1),
      top .24s cubic-bezier(.2, .8, .2, 1),
      width .4s ease, height .4s ease, border-radius .4s ease,
      transform .15s ease, box-shadow .15s ease;
  }
  .tile svg { display: block; width: 100%; height: 100%; pointer-events: none; }
  .tile:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; z-index: 3; }
  .tile[aria-pressed="true"] {
    transform: scale(1.05);
    box-shadow: 0 0 0 4px var(--gold), 0 12px 24px var(--shadow);
    z-index: 2;
  }
  .tile.nope { animation: nope .32s ease; }
  @keyframes nope {
    25% { transform: translateX(-5px); }
    60% { transform: translateX(5px); }
    85% { transform: translateX(-2px); }
  }

  .blank svg { opacity: 0; transition: opacity .4s ease; }
  .blank::before {
    content: "";
    position: absolute;
    inset: 9px;
    border: 2px dashed var(--blank-edge);
    border-radius: 6px;
    transition: border-color .15s ease, opacity .3s ease;
  }
  .board.armed .blank::before { border-color: var(--berry); animation: invite 1s ease-in-out infinite; }
  @keyframes invite { 50% { inset: 14px; } }

  .full {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border-radius: 12px;
    opacity: 0;
    pointer-events: none;
    z-index: 4;
  }
  .board.solved { --gap: 0px; overflow: hidden; }
  .board.solved .tile { border-radius: 0; cursor: default; }
  .board.solved .blank svg { opacity: 1; }
  .board.solved .blank::before { opacity: 0; }
  .board.solved .full { opacity: 1; transition: opacity .35s ease .4s; }

  .status {
    margin: 0;
    min-height: 3em;
    padding: 0 4px 2px;
    color: var(--tray-ink);
    font-weight: 600;
    display: flex;
    align-items: center;
  }

  .meta { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .stats { display: flex; gap: 28px; margin: 0; }
  .stats dt {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .stats dd {
    margin: 0;
    font: 400 30px/1.1 var(--display);
    font-variant-numeric: tabular-nums;
  }
  .goal { margin: 0; display: flex; align-items: center; gap: 10px; color: var(--ink-soft); font-size: 13px; line-height: 1.25; }
  .goal figcaption { max-width: 8ch; text-align: right; }
  .goal svg { width: 68px; height: 68px; border-radius: 10px; display: block; flex: none; }

  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: 16px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
  }
  .btn {
    font: 700 16px/1 var(--body);
    color: var(--berry-ink);
    background: var(--berry);
    border: 0;
    border-radius: 999px;
    padding: 15px 26px;
    cursor: pointer;
    touch-action: manipulation;
  }
  .btn:active { transform: translateY(1px); }
  .btn:focus-visible, .mode input:focus-visible + span { outline: 3px solid var(--gold); outline-offset: 2px; }
  .mode { border: 0; padding: 0; margin: 0; min-width: min-content; flex: 1 1 auto; }
  .mode legend { padding: 0; margin-bottom: 6px; font-size: 13px; color: var(--ink-soft); }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 3px; }
  .seg label { flex: 1 1 auto; cursor: pointer; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg span {
    display: block;
    text-align: center;
    padding: 9px 10px;
    white-space: nowrap;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink-soft);
  }
  .seg input:checked + span { background: var(--ink); color: var(--page); }

  @media (prefers-reduced-motion: reduce) {
    .tile, .blank svg, .blank::before, .full { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>

<main class="wrap">
  <header class="head">
    <h1>Holiday Cup Puzzle</h1>
    <p class="how">Tap a picture tile, then tap the white square to move it there. Put all nine squares back in order to finish the picture.</p>
  </header>

  <section class="tray" aria-label="Puzzle">
    <div class="board" id="board" role="group" aria-label="Puzzle board, 3 by 3">
      <svg class="full" viewBox="0 0 600 600" aria-hidden="true"><use href="#scene"/></svg>
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </section>

  <div class="meta">
    <dl class="stats">
      <div><dt>Moves</dt><dd id="moves">0</dd></div>
      <div><dt>Time</dt><dd id="time">0:00</dd></div>
    </dl>
    <figure class="goal">
      <figcaption>Finished picture</figcaption>
      <svg viewBox="0 0 600 600" role="img" aria-label="The finished picture: a red holiday cup on a table, with a gift, a small tree, a candy cane and string lights"><use href="#scene"/></svg>
    </figure>
  </div>

  <div class="controls">
    <button type="button" class="btn" id="shuffle">Shuffle</button>
    <fieldset class="mode">
      <legend>Which tiles can move?</legend>
      <div class="seg">
        <label><input type="radio" name="mode" id="mode-slide" value="slide" checked><span>Next to white</span></label>
        <label><input type="radio" name="mode" id="mode-any" value="any"><span>Any tile</span></label>
      </div>
    </fieldset>
  </div>
</main>

<script>
(function () {
  var SIZE = 3, COUNT = SIZE * SIZE, BLANK = COUNT - 1;
  var SVG = 'http://www.w3.org/2000/svg';

  var board = document.getElementById('board');
  var statusEl = document.getElementById('status');
  var movesEl = document.getElementById('moves');
  var timeEl = document.getElementById('time');
  var shuffleBtn = document.getElementById('shuffle');
  var modeInputs = document.querySelectorAll('input[name="mode"]');

  // order[position] = tile id. Tile ids are their home positions; BLANK is the white square.
  var order = [], moves = 0, elapsed = 0, mode = 'slide', selected = null, solved = false, timer = null;
  var tiles = [];

  for (var id = 0; id < COUNT; id++) tiles.push(makeTile(id));

  function makeTile(id) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = id === BLANK ? 'tile blank' : 'tile';
    var svg = document.createElementNS(SVG, 'svg');
    svg.setAttribute('viewBox', (id % SIZE) * 200 + ' ' + Math.floor(id / SIZE) * 200 + ' 200 200');
    svg.setAttribute('aria-hidden', 'true');
    var use = document.createElementNS(SVG, 'use');
    use.setAttribute('href', '#scene');
    svg.appendChild(use);
    btn.appendChild(svg);
    btn.addEventListener('click', function () { tap(id); });
    btn.addEventListener('animationend', function () { btn.classList.remove('nope'); });
    board.appendChild(btn);
    return btn;
  }

  function posOf(id) { return order.indexOf(id); }
  function touching(a, b) {
    return Math.abs(a % SIZE - b % SIZE) + Math.abs(Math.floor(a / SIZE) - Math.floor(b / SIZE)) === 1;
  }
  function isSolved() { return order.every(function (id, pos) { return id === pos; }); }
  function clock(s) { return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
  function say(text) { statusEl.textContent = text; }
  function prompt() {
    return mode === 'slide' ? 'Pick a tile next to the white square.' : 'Pick any picture tile.';
  }

  function render() {
    order.forEach(function (id, pos) {
      var el = tiles[id], row = Math.floor(pos / SIZE), col = pos % SIZE;
      el.style.setProperty('--r', row);
      el.style.setProperty('--c', col);
      var where = 'row ' + (row + 1) + ', column ' + (col + 1);
      if (id === BLANK) {
        el.setAttribute('aria-label', (solved ? 'Last piece, ' : 'White square, ') + where);
      } else {
        el.setAttribute('aria-label', 'Picture tile ' + (id + 1) + ', ' + where);
        el.setAttribute('aria-pressed', String(selected === id));
      }
    });
    board.classList.toggle('armed', selected !== null);
    board.classList.toggle('solved', solved);
    movesEl.textContent = moves;
    timeEl.textContent = clock(elapsed);
    shuffleBtn.textContent = solved ? 'Play again' : 'Shuffle';
  }

  function startClock() {
    if (timer) return;
    timer = setInterval(function () { elapsed++; timeEl.textContent = clock(elapsed); }, 1000);
  }
  function stopClock() { clearInterval(timer); timer = null; }

  function tap(id) {
    if (solved) return;
    if (id === BLANK) {
      if (selected === null) say('Pick a picture tile first, then tap the white square.');
      else move(selected);
      return;
    }
    if (selected === id) {
      selected = null;
      say(prompt());
    } else if (mode === 'slide' && !touching(posOf(id), posOf(BLANK))) {
      selected = null;
      tiles[id].classList.add('nope');
      say('That tile isn’t touching the white square. Pick one right next to it.');
    } else {
      selected = id;
      say('Now tap the white square to move it there.');
    }
    render();
  }

  function move(id) {
    var from = posOf(id), to = posOf(BLANK);
    order[to] = id;
    order[from] = BLANK;
    selected = null;
    moves++;
    startClock();
    if (isSolved()) {
      solved = true;
      stopClock();
      say('Picture complete! ' + moves + (moves === 1 ? ' move' : ' moves') + ' in ' + clock(elapsed) + '.');
    } else {
      say(prompt());
    }
    render();
  }

  // Scramble by sliding the white square around at random, so every shuffle can be solved
  // under the strict "next to white" rule too.
  function shuffle() {
    do {
      order = [];
      for (var i = 0; i < COUNT; i++) order.push(i);
      var blank = BLANK, last = -1;
      for (var step = 0; step < 90; step++) {
        var options = [];
        for (var p = 0; p < COUNT; p++) if (p !== last && touching(p, blank)) options.push(p);
        var next = options[Math.floor(Math.random() * options.length)];
        order[blank] = order[next];
        order[next] = BLANK;
        last = blank;
        blank = next;
      }
    } while (isSolved());
    moves = 0; elapsed = 0; selected = null; solved = false;
    stopClock();
    say(prompt());
    render();
  }

  shuffleBtn.addEventListener('click', shuffle);
  modeInputs.forEach(function (input) {
    input.addEventListener('change', function () {
      if (!input.checked) return;
      mode = input.value;
      if (solved) return;
      if (selected !== null && mode === 'slide' && !touching(posOf(selected), posOf(BLANK))) selected = null;
      say(selected === null ? prompt() : 'Now tap the white square to move it there.');
      render();
    });
  });

  // Start a fresh game, or pick up a game in progress when the page is updated in place.
  function start(saved) {
    var ok = saved && Array.isArray(saved.order) && saved.order.length === COUNT &&
      saved.order.slice().sort().join() === '0,1,2,3,4,5,6,7,8';
    if (!ok) { shuffle(); return; }
    order = saved.order.slice();
    moves = saved.moves | 0;
    elapsed = saved.elapsed | 0;
    mode = saved.mode === 'any' ? 'any' : 'slide';
    modeInputs.forEach(function (input) { input.checked = input.value === mode; });
    solved = isSolved();
    if (moves > 0 && !solved) startClock();
    say(solved ? 'Picture complete! ' + moves + ' moves in ' + clock(elapsed) + '.' : prompt());
    render();
  }

  var hot = window.claude && window.claude.hot;
  try {
    if (hot && hot.snapshot) hot.snapshot(function () {
      return { order: order, moves: moves, elapsed: elapsed, mode: mode };
    });
  } catch (e) {}
  if (hot && hot.ready) hot.ready(start);
  else start((hot && hot.data) || {});
})();
</script>
